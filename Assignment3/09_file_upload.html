<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>
    <h1>Upload an Image</h1>
    <p>Only JPG and PNG image files are allowed.</p>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose an image:</label>
        <input type="file" id="image-file" name="image_file" accept=".jpg,.jpeg,.png">
        <br><br>
        <button type="submit">Upload</button>
    </form>
</body>
</html>

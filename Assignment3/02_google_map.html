<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>Map of Mathura</h1>
    <!-- loading="lazy" delays loading the map until it is near the visible area, which can save bandwidth. -->
    <iframe
        title="Google Map showing Mathura"
        src="https://maps.google.com/maps?q=Mathura%2C%20India&output=embed"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>

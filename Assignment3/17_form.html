<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission Example</title>
</head>
<body>
    <h1>Simple Form</h1>
    <form action="result.html" method="get" target="result-frame">
        <label for="user-text">Enter text:</label>
        <input type="text" id="user-text" name="user_text" required>
        <button type="submit">Submit</button>
    </form>

    <iframe name="result-frame" src="result.html" title="Submission result" width="80%" height="150"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>
<!-- Note: frameset/frame are obsolete in HTML5 but are used here because the assignment asks for them. -->
<frameset rows="20%,80%">
    <frame src="frames_navigation.html" name="navigation" title="Navigation links">
    <frame src="frames_welcome.html" name="content" title="Welcome message">
    <noframes>
        <body>Your browser does not support frames.</body>
    </noframes>
</frameset>
</html>

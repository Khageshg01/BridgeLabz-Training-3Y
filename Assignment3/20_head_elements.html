<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title sets the page title shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- charset defines the character encoding used by the document. -->
    <meta charset="UTF-8">

    <!-- description gives search engines a short summary of the page. -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- author identifies the author of the page. -->
    <meta name="author" content="Student">

    <!-- base sets the base URL for relative URLs in the document. -->
    <base href="https://example.com/">

    <!-- link can connect an external resource, such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- style is where CSS rules would go; it is empty as requested. -->
    <style>
    </style>

    <!-- script is where JavaScript could go; it is empty as requested. -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates title, meta, base, link, style, and script elements.</p>
    <a href="about.html">Example relative link using the base URL</a>
</body>
</html>
